name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          echo "--- Testing plain FTP (port 21) ---"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "debug 3; ls; quit" || \
          echo "--- Plain failed, testing FTPS ---" && \
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" -e "debug 3; ls; quit"

      - name: Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set net:max-retries 3;
            mirror --reverse --verbose --delete \
              --exclude \.git \
              --exclude \.github \
              --exclude node_modules \
              --exclude /CONTEXT\.md$ \
              --exclude /ACCOUNTS\.md$ \
              --exclude /SYSTEM-MANUAL\.md$ \
              --exclude /saliksik_schema\.sql$ \
              --exclude \.log$ \
              --exclude /Thumbs\.db$ \
              --exclude /desktop\.ini$ \
              . / ;
            quit
          "
